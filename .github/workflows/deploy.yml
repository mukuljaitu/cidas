name: Deploy Laravel Site

on:
  push:
    branches: [ main ] # Trigger on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 65002
          script: |
            cd /home/u506903612/domains/cidas.cropcarechemical.com/public_html/
            # git pull origin main
            # composer install --no-dev --optimize-autoloader
            # php artisan migrate --force
            # php artisan config:cache
            # php artisan route:cache
            # php artisan view:cache
            # 1. Fetch the latest metadata from GitHub
            git fetch --all
  
            # 2. FORCE the local server files to match GitHub exactly
            # WARNING: This deletes any manual changes made directly on the Hostinger File Manager
            git reset --hard origin/main
  
            # 3. Clean up untracked files (removes old junk)
            git clean -fd
  
            # 4. Standard Laravel optimizations
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
