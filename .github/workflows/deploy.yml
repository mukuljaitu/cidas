name: Deploy Laravel Site

on:
  push:
    branches: [ main ] # Trigger on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 65002
          script: |
            cd /home/u506903612/domains/cidas.cropcarechemical.com/public_html/
            
            # 1. Force Git to reset to exactly what is on GitHub (Solves the "divergent branches" error)
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Handle Composer
            composer install --no-dev --optimize-autoloader
            
            # 3. Handle NPM (Only if you have Node installed on Hostinger)
            # If you don't have Node on Hostinger, you should build locally and push the 'public/build' folder instead.
            if command -v npm &> /dev/null
            then
                npm install
                npm run build
            else
                echo "NPM not found. Skipping build or ensure assets are pre-compiled."
            fi
            
            # 4. Clean up
            php artisan optimize:clear