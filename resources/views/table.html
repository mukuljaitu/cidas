<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sales Tours - Static Version</title>
    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-blue-light: #e8f0fe;
            --google-red: #d93025;
            --google-gray-50: #f8f9fa;
            --google-gray-100: #f1f3f4;
            --google-gray-200: #e8eaed;
            --google-gray-300: #dadce0;
            --google-gray-600: #80868b;
            --google-gray-700: #5f6368;
            --google-gray-900: #202124;
            --header-bg: #f8f9fa;
            --header-text: #5f6368;
            --shadow-popover: 0 1px 2px 0 rgba(60, 64, 67, .30), 0 2px 6px 2px rgba(60, 64, 67, .15);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff;
            color: var(--google-gray-900);
            padding: 32px;
            margin: 0;
        }

        .page-container {
            max-width: 1200px;
            margin: auto;
        }

        .page-title {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 24px;
            color: var(--google-gray-900);
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #fff;
            border: 1px solid var(--google-gray-300);
            border-radius: 8px;
            padding: 20px 24px;
            min-width: 200px;
            flex: 1;
            box-shadow: 0 1px 2px 0 rgba(60, 64, 67, .1);
        }

        .stat-label {
            font-size: 11px;
            color: var(--google-gray-700);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 500;
            color: var(--google-blue);
        }

        /* Table Card */
        .table-card {
            border: 1px solid var(--google-gray-300);
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60, 64, 67, .3), 0 1px 3px 1px rgba(60, 64, 67, .15);
            background: white;
            position: relative;
        }

        /* Toolbar */
        .toolbar {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--google-gray-300);
            background: white;
            border-radius: 8px 8px 0 0;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            height: 32px;
            padding: 0 12px;
            background: white;
            border: 1px solid var(--google-gray-300);
            border-radius: 16px;
            font-size: 14px;
            color: var(--google-gray-700);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            position: relative;
            user-select: none;
        }

        .filter-chip:hover {
            background-color: var(--google-gray-50);
            border-color: var(--google-gray-600);
        }

        .filter-chip.active {
            background-color: var(--google-blue-light);
            border-color: var(--google-blue);
            color: var(--google-blue);
        }

        .filter-chip svg {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            fill: currentColor;
        }

        .filter-chip .arrow {
            margin-left: 8px;
            margin-right: 0;
            width: 14px;
            height: 14px;
        }

        .clear-filters {
            font-size: 13px;
            color: var(--google-blue);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            margin-left: auto;
            font-weight: 500;
        }

        /* Popovers */
        .popover {
            display: none;
            position: absolute;
            top: 40px;
            left: 0;
            background: white;
            border-radius: 8px;
            box-shadow: var(--shadow-popover);
            border: 1px solid var(--google-gray-300);
            z-index: 1000;
            min-width: 280px;
            padding: 8px 0;
            margin-top: 4px;
        }

        .popover.show {
            display: block;
        }

        .popover-header {
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 700;
            color: var(--google-gray-700);
            text-transform: uppercase;
            border-bottom: 1px solid var(--google-gray-100);
        }

        .popover-content {
            padding: 16px;
        }

        .search-box {
            position: relative;
            margin-bottom: 8px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            border: 1px solid var(--google-gray-300);
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .search-box svg {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--google-gray-600);
        }

        .options-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .option-item {
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-item:hover {
            background: var(--google-gray-100);
        }

        .option-item.selected {
            color: var(--google-blue);
            font-weight: 500;
        }

        /* Fancy Date Range Grid */
        .fancy-date-grid {
            display: grid;
            gap: 16px;
        }

        .fancy-date-field {
            position: relative;
            border: 1px solid var(--google-gray-300);
            border-radius: 4px;
            padding: 8px 12px;
            transition: border-color 0.2s;
        }

        .fancy-date-field:focus-within {
            border-color: var(--google-blue);
            box-shadow: 0 0 0 1px var(--google-blue);
        }

        .fancy-date-field label {
            position: absolute;
            top: -8px;
            left: 10px;
            background: white;
            padding: 0 4px;
            font-size: 10px;
            font-weight: 700;
            color: var(--google-blue);
            text-transform: uppercase;
        }

        .fancy-date-field input {
            border: none;
            outline: none;
            width: 100%;
            font-family: inherit;
            font-size: 14px;
            color: var(--google-gray-900);
            background: transparent;
        }

        /* Table */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 0 0 8px 8px;
            min-height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        thead th {
            background-color: var(--header-bg);
            color: var(--header-text);
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            padding: 14px 24px;
            border-bottom: 1px solid var(--google-gray-300);
            position: sticky;
            top: 0;
            z-index: 2;
        }

        tbody td {
            padding: 14px 24px;
            font-size: 14px;
            color: var(--google-gray-900);
            border-bottom: 1px solid var(--google-gray-100);
            white-space: nowrap;
        }

        .cities-cell {
            color: var(--google-blue);
            cursor: pointer;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cities-cell:hover {
            text-decoration: underline;
        }

        tbody tr:nth-child(even) {
            background-color: var(--google-gray-50);
        }

        tbody tr:hover {
            background-color: #f1f8ff;
        }

        tbody tr.selected-row {
            background-color: #e8f0fe !important;
        }

        /* Action Menu */
        .actions-cell {
            text-align: right;
            width: 80px;
            position: relative;
        }

        .dots-btn {
            background: none;
            border: none;
            color: var(--google-gray-700);
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            outline: none;
        }

        .dots-btn:hover {
            background-color: var(--google-gray-200);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 24px;
            background: white;
            min-width: 180px;
            box-shadow: var(--shadow-popover);
            border: 1px solid var(--google-gray-300);
            border-radius: 4px;
            z-index: 1000;
            padding: 8px 0;
            margin-top: -8px;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 10px 16px;
            font-size: 14px;
            color: var(--google-gray-900);
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            border: none;
            background: none;
        }

        .dropdown-item:hover {
            background-color: var(--google-gray-100);
        }

        .dropdown-item svg {
            width: 20px;
            height: 20px;
            fill: var(--google-gray-700);
        }

        .dropdown-item.delete-action {
            color: var(--google-red);
            border-top: 1px solid var(--google-gray-200);
            margin-top: 4px;
            padding-top: 12px;
        }

        .dropdown-item.delete-action svg {
            fill: var(--google-red);
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(32, 33, 36, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 32px;
            width: 90%;
            max-width: 650px;
            box-shadow: 0 24px 38px 3px rgba(0, 0, 0, 0.14);
            animation: modalPop 0.2s ease-out;
        }

        @keyframes modalPop {
            from {
                transform: scale(0.95);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .modal-body {
            margin-bottom: 32px;
            color: var(--google-gray-700);
            font-size: 14px;
            line-height: 1.6;
            max-height: 450px;
            overflow-y: auto;
        }

        .city-tag {
            background: var(--google-gray-100);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            display: inline-block;
            margin: 4px;
            border: 1px solid var(--google-gray-300);
        }

        /* Status Badges */
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
            text-transform: capitalize;
        }

        .status-visit {
            background-color: #e6f4ea;
            color: #1e8e3e;
        }

        .status-holiday {
            background-color: #fef7e0;
            color: #f9ab00;
        }

        .status-leave {
            background-color: #fce8e6;
            color: #d93025;
        }

        .status-nostation {
            background-color: #e8f0fe;
            color: #1a73e8;
        }

        .status-default {
            background-color: #f1f3f4;
            color: #5f6368;
        }

        .pagination-container {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            border-top: 1px solid var(--google-gray-300);
        }
    </style>
</head>

<body>

    <div class="page-container">

        <div class="table-card" id="mainCard">
            <div class="toolbar">
                <!-- Name Filter -->
                <div style="position: relative;">
                    <div id="chip-name" class="filter-chip" onclick="handlePopoverToggle(event, 'popover-name')">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
                        </svg>
                        <span id="label-name">Name: All</span>
                        <svg class="arrow" viewBox="0 0 24 24">
                            <path d="M7 10l5 5 5-5H7z" />
                        </svg>
                    </div>
                    <div id="popover-name" class="popover">
                        <div class="popover-header">Filter by Name</div>
                        <div class="popover-content">
                            <div class="search-box">
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                                </svg>
                                <input type="text" id="nameSearch" placeholder="Search names..."
                                    oninput="filterNameOptions()">
                            </div>
                            <div id="nameOptions" class="options-list"></div>
                        </div>
                    </div>
                </div>

                <!-- Date Range Filter -->
                <div style="position: relative;">
                    <div id="chip-date" class="filter-chip" onclick="handlePopoverToggle(event, 'popover-date')">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z" />
                        </svg>
                        <span id="label-date">Date Range</span>
                        <svg class="arrow" viewBox="0 0 24 24">
                            <path d="M7 10l5 5 5-5H7z" />
                        </svg>
                    </div>
                    <div id="popover-date" class="popover" style="min-width: 320px;">
                        <div class="popover-header">Filter by Range</div>
                        <div class="popover-content">
                            <div class="fancy-date-grid">
                                <div class="fancy-date-field">
                                    <label>Start Date</label>
                                    <input type="date" id="dateStart" onchange="applyFilters()">
                                </div>
                                <div class="fancy-date-field">
                                    <label>End Date</label>
                                    <input type="date" id="dateEnd" onchange="applyFilters()">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Status Filter -->
                <div style="position: relative;">
                    <div id="chip-status" class="filter-chip" onclick="handlePopoverToggle(event, 'popover-status')">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z" />
                            <path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z" />
                        </svg>
                        <span id="label-status">Status: All</span>
                        <svg class="arrow" viewBox="0 0 24 24">
                            <path d="M7 10l5 5 5-5H7z" />
                        </svg>
                    </div>
                    <div id="popover-status" class="popover">
                        <div class="popover-header">Filter by Status</div>
                        <div class="popover-content">
                            <div id="statusOptions" class="options-list">
                                <div class="option-item" onclick="selectStatus('All')">All Statuses</div>
                                <div class="option-item" onclick="selectStatus('Field Visit')">Field Visit</div>
                                <div class="option-item" onclick="selectStatus('Holiday')">Holiday</div>
                                <div class="option-item" onclick="selectStatus('Leave')">Leave</div>
                                <div class="option-item" onclick="selectStatus('No Station')">No Station</div>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="clear-filters" onclick="clearAllFilters()">Clear All</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 25%;">Name</th>
                            <th style="width: 15%;">Date</th>
                            <th style="width: 35%;">Cities</th>
                            <th style="width: 15%;">Status</th>
                            <th class="actions-cell">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="pagination-container">
                <span id="pageInfo" style="font-size: 13px; color: var(--google-gray-700);"></span>
                <div style="display: flex; gap: 8px;">
                    <button class="dots-btn" id="prevPage" onclick="changePage(-1)"
                        style="width: 32px; height: 32px; font-size: 18px;">‹</button>
                    <button class="dots-btn" id="nextPage" onclick="changePage(1)"
                        style="width: 32px; height: 32px; font-size: 18px;">›</button>
                </div>
            </div>

            <!-- Action Menu -->
            <div id="actionMenu" class="dropdown-menu">
                <button class="dropdown-item" onclick="handleEditClick()">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
                    </svg>
                    Edit (Demo)
                </button>
                <button class="dropdown-item delete-action" onclick="handleDeleteClick()">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                    </svg>
                    Delete (Demo)
                </button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="citiesModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title" id="citiesModalTitle">List of Cities</div>
            <div class="modal-body">
                <div id="citiesListContainer"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-save"
                    style="padding: 10px 24px; border-radius: 4px; font-size: 14px; background-color: var(--google-blue); color: white; border:none; cursor:pointer;"
                    onclick="closeModals()">Close</button></div>
        </div>
    </div>

    <script>
        /* ========= STATIC MOCK DATA ========= */
        let data = [
            { id: 1, name: "Rahul Sharma", date: "2023-10-25", cities: ["Mumbai", "Pune", "Thane"], status: "1", is_supervisor: 1 },
            { id: 2, name: "Anita Desai", date: "2023-10-25", cities: ["Delhi", "Noida", "Gurugram"], status: "Field Visit", is_supervisor: 0 },
            { id: 3, name: "Vijay Kumar", date: "2023-10-24", cities: ["Bangalore", "Mysore"], status: "Holiday", is_supervisor: 0 },
            { id: 4, name: "Sneha Patil", date: "2023-10-24", cities: ["Ahmedabad", "Surat", "Rajkot", "Vadodara"], status: "1", is_supervisor: 0 },
            { id: 5, name: "Amit Singh", date: "2023-10-23", cities: ["Kolkata", "Howrah"], status: "Leave", is_supervisor: 0 },
            { id: 6, name: "Priya Nair", date: "2023-10-23", cities: ["Chennai", "Coimbatore"], status: "No Station", is_supervisor: 1 },
            { id: 7, name: "Suresh Raina", date: "2023-10-22", cities: ["Hyderabad", "Secunderabad"], status: "1", is_supervisor: 0 },
            { id: 8, name: "Deepak Chahar", date: "2023-10-22", cities: ["Jaipur", "Jodhpur", "Udaipur"], status: "Field Visit", is_supervisor: 0 },
            { id: 9, name: "Manoj Tiwary", date: "2023-10-21", cities: ["Patna", "Gaya"], status: "Holiday", is_supervisor: 0 },
            { id: 10, name: "Ravi Ashwin", date: "2023-10-21", cities: ["Lucknow", "Kanpur"], status: "1", is_supervisor: 0 },
            { id: 11, name: "Ishant Sharma", date: "2023-10-20", cities: ["Chandigarh", "Mohali"], status: "Field Visit", is_supervisor: 0 },
            { id: 12, name: "Jasprit Bumrah", date: "2023-10-20", cities: ["Ahmedabad"], status: "1", is_supervisor: 1 }
        ];

        /* ========= GLOBAL STATE ========= */
        let activeResourceId = null;
        let selectedName = 'All';
        let selectedStatus = 'All';
        let currentPage = 1;
        const rowsPerPage = 5;
        let currentFilteredData = [...data];
        const CITY_CHAR_LIMIT = 50;

        /* ========= HELPERS ========= */
        function formatIndianDate(dateStr) {
            if (!dateStr) return '';
            const [year, month, day] = dateStr.split('-');
            return `${day}-${month}-${year}`;
        }

        function getStatusClass(status) {
            if (!status) return 'status-default';
            const s = status.toString().toLowerCase();
            if (s === '1') return 'status-default';
            if (s.includes('field visit')) return 'status-visit';
            if (s.includes('no station')) return 'status-nostation';
            if (s.includes('leave')) return 'status-leave';
            if (s.includes('holiday')) return 'status-holiday';
            return 'status-default';
        }

        /* ========= UI LOGIC ========= */
        function handlePopoverToggle(event, id) {
            event.stopPropagation();
            const popover = document.getElementById(id);
            const isVisible = popover.classList.contains('show');
            closeUIPopovers();
            if (!isVisible) popover.classList.add('show');
        }

        function closeUIPopovers() {
            document.querySelectorAll('.popover').forEach(p => p.classList.remove('show'));
            const actionMenu = document.getElementById('actionMenu');
            actionMenu.classList.remove('show');
            actionMenu.style.display = 'none';
        }

        /* ========= FILTER LOGIC ========= */
        function filterNameOptions() {
            const searchInput = document.getElementById('nameSearch');
            const search = (searchInput ? searchInput.value : "").toLowerCase();
            const uniqueNames = [...new Set(data.map(item => item.name))].sort();
            const container = document.getElementById('nameOptions');
            container.innerHTML = `<div class="option-item ${selectedName === 'All' ? 'selected' : ''}" onclick="selectName('All')">All Names</div>`;

            uniqueNames.forEach(name => {
                if (name.toLowerCase().includes(search)) {
                    const item = document.createElement('div');
                    item.className = `option-item ${selectedName === name ? 'selected' : ''}`;
                    item.innerText = name;
                    item.onclick = (e) => { e.stopPropagation(); selectName(name); };
                    container.appendChild(item);
                }
            });
        }

        function selectName(name) {
            selectedName = name;
            document.getElementById('label-name').innerText = `Name: ${name}`;
            document.getElementById('chip-name').classList.toggle('active', name !== 'All');
            applyFilters();
            closeUIPopovers();
        }

        function selectStatus(status) {
            selectedStatus = status;
            document.getElementById('label-status').innerText = `Status: ${status}`;
            document.getElementById('chip-status').classList.toggle('active', status !== 'All');
            applyFilters();
            closeUIPopovers();
        }

        function applyFilters() {
            const startDateStr = document.getElementById('dateStart').value;
            const endDateStr = document.getElementById('dateEnd').value;

            document.getElementById('chip-date').classList.toggle('active', !!(startDateStr || endDateStr));

            currentFilteredData = data.filter(item => {
                const matchesName = selectedName === 'All' || item.name === selectedName;
                const matchesStatus = selectedStatus === 'All' || (item.status && item.status === selectedStatus);
                const matchesStart = !startDateStr || item.date >= startDateStr;
                const matchesEnd = !endDateStr || item.date <= endDateStr;
                return matchesName && matchesStatus && matchesStart && matchesEnd;
            });

            currentPage = 1;
            renderTable();
        }

        function clearAllFilters() {
            selectedName = 'All';
            selectedStatus = 'All';
            document.getElementById('dateStart').value = '';
            document.getElementById('dateEnd').value = '';
            document.getElementById('nameSearch').value = '';
            document.getElementById('label-name').innerText = 'Name: All';
            document.getElementById('label-status').innerText = 'Status: All';
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            applyFilters();
        }

        /* ========= TABLE RENDER ========= */
        function renderTable() {
            const body = document.getElementById('tableBody');
            body.innerHTML = '';

            const startIndex = (currentPage - 1) * rowsPerPage;
            const paginatedData = currentFilteredData.slice(startIndex, startIndex + rowsPerPage);

            if (paginatedData.length === 0) {
                body.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--google-gray-700);">No results found.</td></tr>';
                updatePaginationUI(0);
                return;
            }

            paginatedData.forEach(item => {
                const row = document.createElement('tr');
                row.id = `row-${item.id}`;
                const supervisorLabel = item.is_supervisor === 1 ? '<span style="color: var(--google-red); font-weight: 500;">, Supervisor</span>' : '';
                const citiesString = item.cities.join(', ');
                const displayCities = citiesString.length > CITY_CHAR_LIMIT ? citiesString.substring(0, CITY_CHAR_LIMIT) + '...' : citiesString;

                row.innerHTML = `
                    <td>${item.name}${supervisorLabel}</td>
                    <td>${formatIndianDate(item.date)}</td>
                    <td class="cities-cell" onclick="openCitiesModal(${item.id})">${displayCities}</td>
                    <td><span class="status-badge ${getStatusClass(item.status)}">${item.status === '1' ? 'Tour' : item.status}</span></td>
                    <td class="actions-cell"><button class="dots-btn" onclick="openMenu(event, ${item.id})">⋮</button></td>
                `;
                body.appendChild(row);
            });

            updatePaginationUI(currentFilteredData.length);
            updateStats();
        }

        function updatePaginationUI(totalItems) {
            const totalPages = Math.ceil(totalItems / rowsPerPage);
            const start = totalItems === 0 ? 0 : (currentPage - 1) * rowsPerPage + 1;
            const end = Math.min(currentPage * rowsPerPage, totalItems);
            document.getElementById('pageInfo').innerText = `${start}-${end} of ${totalItems}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('prevPage').style.opacity = currentPage === 1 ? '0.3' : '1';
            document.getElementById('nextPage').disabled = currentPage === totalPages || totalPages === 0;
            document.getElementById('nextPage').style.opacity = (currentPage === totalPages || totalPages === 0) ? '0.3' : '1';
        }

        function changePage(direction) {
            currentPage += direction;
            renderTable();
        }

        function updateStats() {
            // Using a fixed "today" for the demo purposes (last date in mock data)
            const today = "2023-10-25";
            let tours = 0;
            let cities = new Set();
            data.forEach(d => {
                if (d.date === today) {
                    tours++;
                    d.cities.forEach(c => cities.add(c));
                }
            });
            document.getElementById("totalToursToday").innerText = tours;
            document.getElementById("citiesCovered").innerText = cities.size;
        }

        /* ========= ACTIONS ========= */
        function openMenu(event, id) {
            event.stopPropagation();
            activeResourceId = id;
            const menu = document.getElementById('actionMenu');
            const btn = event.currentTarget;
            const rect = btn.getBoundingClientRect();
            const cardRect = document.getElementById('mainCard').getBoundingClientRect();

            document.querySelectorAll('tr').forEach(r => r.classList.remove('selected-row'));
            document.getElementById(`row-${id}`).classList.add('selected-row');

            menu.style.display = 'block';
            menu.style.top = (rect.bottom - cardRect.top) + 'px';
            menu.style.left = (rect.right - cardRect.left - 180) + 'px';
            menu.classList.add('show');
        }

        function openCitiesModal(id) {
            const item = data.find(d => d.id === id);
            const container = document.getElementById('citiesListContainer');
            document.getElementById('citiesModalTitle').innerText = `Cities for ${item.name}`;
            container.innerHTML = '';
            item.cities.forEach(city => {
                const tag = document.createElement('span');
                tag.className = 'city-tag';
                tag.innerText = city;
                container.appendChild(tag);
            });
            document.getElementById('citiesModal').classList.add('active');
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            closeUIPopovers();
            document.querySelectorAll('tr').forEach(r => r.classList.remove('selected-row'));
        }

        // Demo handlers
        function handleEditClick() {
            alert("Edit modal would open here. In this static version, editing is for demonstration.");
            closeUIPopovers();
        }
        function handleDeleteClick() {
            if (confirm("Delete this entry? (Static demo only)")) {
                data = data.filter(d => d.id !== activeResourceId);
                applyFilters();
            }
            closeUIPopovers();
        }

        /* ========= INITIALIZE ========= */
        window.addEventListener('click', closeUIPopovers);
        filterNameOptions();
        renderTable();
    </script>
</body>

</html>
